font_family         Maple Mono NF
font_size           10.0
bold_font           auto
italic_font         auto
bold_italic_font    auto
disable_ligatures   cursor

cursor_shape                beam
cursor_beam_thickness       1
cursor_underline_thickness  2
cursor_blink_interval       0
cursor                      #fdfff1
cursor_text_color           #000000

background_opacity      0.95
background_image_layout centered
background_tint         0.9

window_logo_alpha  0.1

# The basic colors
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc

# Cursor colors
cursor                  #f5e0dc
cursor_text_color       #1e1e2e

# Scrollbar colors
scrollbar_handle_color  #9399b2
scrollbar_track_color   #45475a

# URL color when hovering with mouse
url_color               #f5e0dc

# Kitty window border colors
active_border_color     #b4befe
inactive_border_color   #6c7086
bell_border_color       #f9e2af

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b

# Colors for marks (marked text in the terminal)
mark1_foreground #1e1e2e
mark1_background #b4befe
mark2_foreground #1e1e2e
mark2_background #cba6f7
mark3_foreground #1e1e2e
mark3_background #74c7ec

# The 16 terminal colors

# black
color0 #45475a
color8 #585b70

# red
color1 #f38ba8
color9 #f38ba8

# green
color2  #a6e3a1
color10 #a6e3a1

# yellow
color3  #f9e2af
color11 #f9e2af

# blue
color4  #89b4fa
color12 #89b4fa

# magenta
color5  #f5c2e7
color13 #f5c2e7

# cyan
color6  #94e2d5
color14 #94e2d5

# white
color7  #bac2de
color15 #a6adc8

show_hyperlink_targets  no
underline_hyperlinks    hover

strip_trailing_spaces smart

hide_window_decorations yes
update_check_interval   0

window_border_width 20pt
window_padding_width 20
#placement_strategy top-left
#resize_in_steps yes

tab_bar_align       center
tab_bar_style       powerline
tab_bar_min_tabs    1
tab_powerline_style slanted

allow_remote_control yes

#shell   .
shell   /bin/bash -l
editor  vim

map alt+c          copy_to_clipboard
map alt+shift+c    copy_or_interrupt

map alt+v paste_from_clipboard

map alt+t  new_tab
map alt+w  close_tab
map alt+/  edit_config_file

map alt+1  goto_tab 1
map alt+2  goto_tab 2
map alt+3  goto_tab 3
map alt+4  goto_tab 4

map f1 launch --allow-remote-control kitty +kitten broadcast
map f5 load_config_file ~/.config/kitty/kitty.conf
