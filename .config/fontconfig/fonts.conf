<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

<!--	=========================================================
		MONOSPACE (Primary coding font)
		========================================================= -->
<match target="pattern">
	<test name="family" compare="eq">
		<string>monospace</string>
	</test>
	<edit name="family" mode="prepend">
		<string>Maple Mono NF</string>
	</edit>
</match>

<!--	=========================================================
		SANS-SERIF (UI font)
		========================================================= -->
<match target="pattern">
	<test name="family" qual="any">
		<string>sans-serif</string>
	</test>
	<edit name="family" mode="prepend">
		<string>Nunito</string>
	</edit>
</match>

<!--	=========================================================
		SERIF (documents)
		========================================================= -->
<match target="pattern">
	<test name="family" qual="any">
		<string>serif</string>
	</test>
	<edit name="family" mode="prepend">
		<string>Source Serif 4</string>
	</edit>
</match>

<!--	=========================================================
		EMOJI + ICONS
		========================================================= -->
<match>
	<edit name="family" mode="append">
		<string>Font Awesome 7 Free</string>
		<string>Noto Color Emoji</string>
	</edit>
</match>

<!--	=========================================================
		CJK FALLBACK
		========================================================= -->

<!-- Japanese -->
<match target="pattern">
	<test name="lang" compare="contains">
		<string>ja</string>
	</test>
	<edit name="family" mode="prepend">
		<string>IPAGothic</string>
		<string>IPAMincho</string>
	</edit>
</match>

<!-- Korean -->
<match target="pattern">
	<test name="lang" compare="contains">
		<string>ko</string>
	</test>
	<edit name="family" mode="prepend">
		<string>NanumGothic</string>
		<string>NanumGothicCoding</string>
	</edit>
</match>

<!-- Chinese (fallback only, NOT primary use) -->
<match target="pattern">
	<test name="lang" compare="contains">
		<string>zh</string>
	</test>
	<edit name="family" mode="prepend">
		<string>WenQuanYi Zen Hei</string>
	</edit>
</match>

</fontconfig>
